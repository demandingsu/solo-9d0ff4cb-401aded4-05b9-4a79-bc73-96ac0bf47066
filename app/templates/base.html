<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}园区电量试算{% endblock %}</title>
  <style>
    body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #f4f6f8; color: #1f2933; }
    .wrap { max-width: 820px; margin: 40px auto; background: #fff; padding: 32px 40px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    h1 { font-size: 22px; margin-top: 0; }
    h2 { font-size: 17px; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    input[type=text], select { width: 100%; padding: 9px 10px; border: 1px solid #cbd2d9; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    button, .btn { margin-top: 24px; background: #2563eb; color: #fff; border: 0; padding: 10px 26px; border-radius: 6px; font-size: 15px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .flash { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; }
    .error-box { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 18px 20px; border-radius: 8px; }
    .hint { color: #64748b; font-size: 13px; margin-top: 4px; }
    code { background: #f1f5f9; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block body %}{% endblock %}
  </div>
</body>
</html>
